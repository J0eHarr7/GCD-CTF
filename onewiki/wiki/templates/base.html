<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{% block title %}The One Wiki{% endblock %}</title>
  <style>
    body { font-family: Georgia, serif; background: #0e0c0a; color: #d8cBa0;
           max-width: 800px; margin: 40px auto; padding: 0 20px; }
    a { color: #c9a227; }
    h1, h2 { color: #c9a227; border-bottom: 1px solid #3a2f1e; padding-bottom: 6px; }
    nav { margin-bottom: 20px; font-size: 0.9em; }
    nav a { margin-right: 14px; }
    .page-body { white-space: pre-wrap; line-height: 1.5; background: #1a1611;
                 padding: 16px; border: 1px solid #3a2f1e; border-radius: 4px; }
    textarea { width: 100%; height: 220px; background: #1a1611; color: #d8cBa0;
               border: 1px solid #3a2f1e; font-family: monospace; }
    input[type=text], input[type=password] { background: #1a1611; color: #d8cBa0;
               border: 1px solid #3a2f1e; padding: 6px; width: 300px; }
    button { background: #3a2f1e; color: #c9a227; border: 1px solid #c9a227;
             padding: 6px 14px; cursor: pointer; }
    .meta { color: #8a7c5a; font-size: 0.85em; }
  </style>
</head>
<body>
  <nav>
    <a href="/">The One Wiki</a>
    {% if user %}
      | logged in as <b>{{ user }}</b> | <a href="/logout">log out</a>
    {% else %}
      | <a href="/login">log in</a>
    {% endif %}
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
