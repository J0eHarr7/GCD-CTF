{% extends "base.html" %}
{% block title %}Register — Lina's Blog{% endblock %}
{% block content %}
<h1>Create an account</h1>
<p class="muted">New accounts start with a $50.00 reading wallet.</p>
<form method="post" class="inline" style="flex-direction:column; align-items:stretch; max-width:320px;">
  <input name="username" placeholder="Username" required>
  <input name="password" type="password" placeholder="Password" required>
  <button type="submit">Register</button>
</form>
<p class="muted">Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
{% endblock %}
