<!doctype html>
<html>
<head>
  <title>TopCookiz - Stock Management</title>
  <style>
    body { font-family: Arial, sans-serif; background:#fff7ef; margin:0; }
    .nav { background:#6b3f1d; color:#fff; padding:14px 24px; display:flex; justify-content:space-between; }
    .nav a { color:#fff; margin-left:16px; text-decoration:none; }
    .hero { padding:60px 24px; text-align:center; }
    .hero h1 { font-size:2.4em; color:#6b3f1d; }
    .card { background:#fff; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,.08); padding:24px; max-width:480px; margin:24px auto; }
  </style>
</head>
<body>
  <div class="nav">
    <div><b>🍪 TopCookiz Stock</b></div>
    <div>
      {% if user %}
        <a href="/stock">Stock</a>
        <a href="/admin/dashboard">Admin</a>
        <a href="/logout">Logout ({{ user['username'] }})</a>
      {% else %}
        <a href="/login">Login</a>
      {% endif %}
    </div>
  </div>
  <div class="hero">
    <h1>Welcome to TopCookiz</h1>
    <p>Internal stock management for our cookie factory batches.</p>
    {% if not user %}
    <div class="card">
      <p>Please log in to manage stock.</p>
      <a href="/login">Go to login</a>
    </div>
    {% endif %}
  </div>
</body>
</html>
